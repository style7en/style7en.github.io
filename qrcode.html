<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二维码生成器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            color: #fff;
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 16px;
            resize: vertical;
            outline: none;
            transition: border-color 0.3s;
        }

        textarea:focus {
            border-color: #4fc3f7;
        }

        textarea::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        button {
            display: block;
            width: 100%;
            padding: 14px;
            margin-top: 16px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #4fc3f7, #29b6f6);
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 195, 247, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        #qrcode {
            display: flex;
            justify-content: center;
            margin-top: 30px;
            padding: 20px;
            background: #fff;
            border-radius: 10px;
            min-height: 180px;
            align-items: center;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: #4fc3f7;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>二维码生成器</h1>
        <textarea id="textInput" placeholder="请输入要转换为二维码的文本或链接..." maxlength="10000"></textarea>
        <button id="generateBtn">生成二维码</button>
        <div id="qrcode"></div>
        <a href="index.html" class="back-link">← 返回首页</a>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <script>
        const textInput = document.getElementById('textInput');
        const qrContainer = document.getElementById('qrcode');

        function generateQR(text) {
            if (!text.trim()) return;

            qrContainer.innerHTML = '';

            try {
                const qr = qrcode(0, 'L');
                qr.addData(text);
                qr.make();

                const moduleCount = qr.getModuleCount();
                const cellSize = Math.floor(200 / moduleCount);
                const margin = cellSize * 2;
                const qrSize = cellSize * moduleCount;

                const canvas = document.createElement('canvas');
                canvas.width = qrSize + margin * 2;
                canvas.height = qrSize + margin * 2;
                const ctx = canvas.getContext('2d');

                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#000000';
                for (let row = 0; row < moduleCount; row++) {
                    for (let col = 0; col < moduleCount; col++) {
                        if (qr.isDark(row, col)) {
                            ctx.fillRect(
                                margin + col * cellSize,
                                margin + row * cellSize,
                                cellSize, cellSize
                            );
                        }
                    }
                }

                qrContainer.appendChild(canvas);
            } catch (e) {
                qrContainer.innerHTML = '<span style="color:#e74c3c;font-size:14px;">内容过长，无法生成二维码，请减少输入文字</span>';
            }
        }

        document.getElementById('generateBtn').addEventListener('click', function () {
            generateQR(textInput.value);
        });

        textInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                generateQR(textInput.value);
            }
        });
    </script>
</body>
</html>
