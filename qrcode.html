<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二维码生成器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            color: #fff;
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 16px;
            resize: vertical;
            outline: none;
            transition: border-color 0.3s;
        }

        textarea:focus {
            border-color: #4fc3f7;
        }

        textarea::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .btn-row button {
            flex: 1;
            margin: 0;
            padding: 13px 8px;
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-row button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 195, 247, 0.35);
        }

        .btn-row button:active {
            transform: translateY(0);
        }

        #generateBtn { background: linear-gradient(135deg, #4fc3f7, #29b6f6); }

        .btn-scan { background: linear-gradient(135deg, #66bb6a, #43a047); }

        /* 扫描弹窗 */
        .scan-panel {
            width: min(86vw, 400px);
        }

        .scan-video-wrap {
            position: relative;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
        }

        .scan-video-wrap video {
            display: block;
            width: 100%;
            aspect-ratio: 3 / 4;
            object-fit: cover;
        }

        .scan-frame {
            position: absolute;
            inset: 10%;
            pointer-events: none;
            background:
                linear-gradient(#4fc3f7, #4fc3f7) left top / 30px 4px,
                linear-gradient(#4fc3f7, #4fc3f7) left top / 4px 30px,
                linear-gradient(#4fc3f7, #4fc3f7) right top / 30px 4px,
                linear-gradient(#4fc3f7, #4fc3f7) right top / 4px 30px,
                linear-gradient(#4fc3f7, #4fc3f7) left bottom / 30px 4px,
                linear-gradient(#4fc3f7, #4fc3f7) left bottom / 4px 30px,
                linear-gradient(#4fc3f7, #4fc3f7) right bottom / 30px 4px,
                linear-gradient(#4fc3f7, #4fc3f7) right bottom / 4px 30px;
            background-repeat: no-repeat;
        }

        .scan-status {
            color: #5a6470;
            font-size: 14px;
            text-align: center;
        }

        .toast {
            position: fixed;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 18px;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            z-index: 200;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
        }

        /* 二维码弹窗 */
        .qr-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }

        .qr-modal.show {
            display: flex;
        }

        .qr-modal-panel {
            position: relative;
            background: #fff;
            border-radius: 16px;
            padding: 30px;
            max-width: 92vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.5);
            animation: popIn 0.22s ease;
        }

        @keyframes popIn {
            from { transform: scale(0.92); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .qr-close {
            position: absolute;
            top: 10px;
            right: 12px;
            width: 36px;
            height: 36px;
            margin: 0;
            padding: 0;
            border-radius: 50%;
            background: #f0f2f5;
            color: #5a6470;
            font-size: 20px;
            line-height: 1;
            box-shadow: none;
        }

        .qr-close:hover {
            background: #e2e6ea;
            transform: none;
            box-shadow: none;
        }

        .qr-modal-body canvas {
            display: block;
            max-width: 86vw;
            max-height: 66vh;
            image-rendering: pixelated;
        }

        .qr-modal-error {
            color: #d9534f;
            font-size: 15px;
        }

        .qr-hint {
            color: #8a93a0;
            font-size: 13px;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: #4fc3f7;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>二维码生成器</h1>
        <textarea id="textInput" placeholder="请输入要转换为二维码的文本或链接..." maxlength="10000"></textarea>
        <div class="btn-row">
            <button id="generateBtn">生成二维码</button>
            <button id="scanBtn" class="btn-scan">📷 扫描二维码</button>
        </div>
        <a href="index.html" class="back-link">← 返回首页</a>
    </div>

    <div class="qr-modal" id="qrModal">
        <div class="qr-modal-panel">
            <button class="qr-close" id="closeBtn" aria-label="关闭">×</button>
            <div class="qr-modal-body" id="qrModalBody"></div>
            <div class="qr-hint">扫描即可读取内容 · 右键或长按可保存图片</div>
        </div>
    </div>

    <div class="qr-modal" id="scanModal">
        <div class="qr-modal-panel scan-panel">
            <button class="qr-close" id="scanCloseBtn" aria-label="关闭">×</button>
            <div class="scan-video-wrap">
                <video id="scanVideo" playsinline muted></video>
                <div class="scan-frame"></div>
            </div>
            <div class="scan-status" id="scanStatus">正在启动摄像头…</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
    <script>
        const textInput = document.getElementById('textInput');
        const qrModal = document.getElementById('qrModal');
        const qrModalBody = document.getElementById('qrModalBody');
        const scanModal = document.getElementById('scanModal');
        const scanVideo = document.getElementById('scanVideo');
        const scanStatus = document.getElementById('scanStatus');

        function generateQR(text) {
            if (!text.trim()) {
                textInput.focus();
                return;
            }

            qrModalBody.innerHTML = '';

            try {
                const qr = qrcode(0, 'L');
                qr.addData(text);
                qr.make();

                const moduleCount = qr.getModuleCount();
                /* 按弹窗可用空间 + 屏幕像素密度渲染原生分辨率，文字再多也不模糊 */
                const dpr = window.devicePixelRatio || 1;
                const base = Math.min(560, window.innerWidth * 0.86, window.innerHeight * 0.66);
                const cellSize = Math.max(2, Math.floor((base * dpr) / (moduleCount + 8)));
                const margin = cellSize * 4; /* 四周各留 4 个模块的静区 */
                const qrSize = cellSize * moduleCount + margin * 2;

                const canvas = document.createElement('canvas');
                canvas.width = qrSize;
                canvas.height = qrSize;
                canvas.style.width = Math.round(qrSize / dpr) + 'px';
                canvas.style.height = Math.round(qrSize / dpr) + 'px';
                const ctx = canvas.getContext('2d');

                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, qrSize, qrSize);

                ctx.fillStyle = '#000000';
                for (let row = 0; row < moduleCount; row++) {
                    for (let col = 0; col < moduleCount; col++) {
                        if (qr.isDark(row, col)) {
                            ctx.fillRect(
                                margin + col * cellSize,
                                margin + row * cellSize,
                                cellSize, cellSize
                            );
                        }
                    }
                }

                qrModalBody.appendChild(canvas);
                qrModal.classList.add('show');
            } catch (e) {
                qrModalBody.innerHTML = '<span class="qr-modal-error">内容过长，无法生成二维码，请减少输入文字</span>';
                qrModal.classList.add('show');
            }
        }

        function closeModal() {
            qrModal.classList.remove('show');
        }

        function toast(msg, ok) {
            const el = document.createElement('div');
            el.className = 'toast';
            el.style.background = ok ? '#2e7d32' : '#c62828';
            el.textContent = msg;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 2500);
        }

        /* ---------- 扫描 ---------- */
        let scanStream = null;
        let scanTimer = null;
        let qrDetector = null;
        let scanSession = 0;

        async function openScanner() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                scanModal.classList.add('show');
                scanStatus.textContent = '当前环境不支持摄像头（需要 https 或 localhost）';
                return;
            }
            const session = ++scanSession;
            scanModal.classList.add('show');
            scanStatus.textContent = '正在启动摄像头…';
            try {
                try {
                    scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                } catch (e) {
                    scanStream = await navigator.mediaDevices.getUserMedia({ video: true });
                }
            } catch (e) {
                if (session !== scanSession) return;
                scanStatus.textContent = e.name === 'NotAllowedError'
                    ? '摄像头权限被拒绝，请在浏览器地址栏允许后重试'
                    : '未检测到可用的摄像头';
                return;
            }
            if (session !== scanSession) { stopScanner(); return; }
            scanVideo.srcObject = scanStream;
            try { await scanVideo.play(); } catch (e) { /* 某些浏览器需要用户手势后才能自动播放 */ }
            scanStatus.textContent = '将二维码对准取景框';

            /* 识别引擎：优先浏览器原生 BarcodeDetector，否则回退 jsQR */
            if (!qrDetector && 'BarcodeDetector' in window) {
                try { qrDetector = new BarcodeDetector({ formats: ['qr_code'] }); }
                catch (e) { try { qrDetector = new BarcodeDetector(); } catch (e2) { qrDetector = null; } }
            }

            const cvs = document.createElement('canvas');
            const cctx = cvs.getContext('2d', { willReadFrequently: true });
            const tick = async () => {
                if (session !== scanSession || !scanStream) return;
                if (scanVideo.readyState >= 2 && scanVideo.videoWidth > 0) {
                    try {
                        if (qrDetector) {
                            const found = await qrDetector.detect(scanVideo);
                            if (session !== scanSession) return;
                            if (found && found.length && found[0].rawValue) {
                                onScanSuccess(found[0].rawValue, session);
                                return;
                            }
                        } else if (window.jsQR) {
                            const w = 480;
                            const h = Math.max(1, Math.round(w * scanVideo.videoHeight / scanVideo.videoWidth));
                            cvs.width = w;
                            cvs.height = h;
                            cctx.drawImage(scanVideo, 0, 0, w, h);
                            const code = jsQR(cctx.getImageData(0, 0, w, h).data, w, h);
                            if (session !== scanSession) return;
                            if (code && code.data) {
                                onScanSuccess(code.data, session);
                                return;
                            }
                        } else {
                            scanStatus.textContent = '识别组件加载失败，请检查网络后刷新页面';
                            return;
                        }
                    } catch (e) { /* 单帧识别失败忽略，继续下一帧 */ }
                }
                scanTimer = setTimeout(tick, 120);
            };
            tick();
        }

        function stopScanner() {
            scanSession++; /* 使在途的识别回调失效 */
            if (scanTimer) { clearTimeout(scanTimer); scanTimer = null; }
            if (scanStream) {
                scanStream.getTracks().forEach(t => t.stop());
                scanStream = null;
            }
            scanVideo.srcObject = null;
        }

        function closeScanner() {
            stopScanner();
            scanModal.classList.remove('show');
        }

        function onScanSuccess(text, session) {
            if (session !== scanSession) return;
            stopScanner();
            scanModal.classList.remove('show');
            textInput.value = text;
            textInput.focus();
            textInput.select();
            toast('✓ 识别成功，内容已填入文本框', true);
        }

        document.getElementById('generateBtn').addEventListener('click', function () {
            generateQR(textInput.value);
        });

        document.getElementById('scanBtn').addEventListener('click', openScanner);
        document.getElementById('closeBtn').addEventListener('click', closeModal);
        document.getElementById('scanCloseBtn').addEventListener('click', closeScanner);

        /* 点击遮罩空白处关闭 */
        qrModal.addEventListener('click', function (e) {
            if (e.target === qrModal) closeModal();
        });

        scanModal.addEventListener('click', function (e) {
            if (e.target === scanModal) closeScanner();
        });

        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') {
                closeModal();
                closeScanner();
            }
        });

        textInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                generateQR(textInput.value);
            }
        });
    </script>
</body>
</html>
