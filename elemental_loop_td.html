        'tower', t.type, t.level, t.getAtk(), t.getRangeRatio().toFixed(3),
        t.getSpeed().toFixed(1), t.critRate.toFixed(3), t.critDamage.toFixed(3),
        upgCost, hasMaxBtn,
      ].join('|');
    } else if (this.selectedTowerType) {
      const existing = this.towers.find(t => t.type === this.selectedTowerType);
      return ['type', this.selectedTowerType, existing ? existing.level : 0].join('|');
    }
    return 'none';
  },

  // 计算从当前等级升 N 级的累计费用(固定费用)
  // 返回 { totalCost, affordableLevels }:其中 affordableLevels 是手头金币最多能升的级数
  _computeUpgradeCost(tower, n) {
    const total = UPGRADE_COST_FIXED * n;
    const affordable = Math.min(n, Math.floor(safeFinite(this.gold, 0) / UPGRADE_COST_FIXED));
    return { totalCost: total, affordableLevels: affordable };
  },

  // 用当前金币能连升多少级(固定升级费)
  _maxAffordableLevels(tower) {
    return Math.floor(safeFinite(this.gold, 0) / UPGRADE_COST_FIXED);
  },

  // 局部更新升级按钮的 disabled 状态 + 满级按钮文本/数值,不重建 DOM 节点
  // 这样金币高频变化(怪物掉金币)不会让玩家点击的按钮节点被替换。
  _refreshInfoPanelDynamic() {
    if (!this.selectedTower) return;
    const t = this.selectedTower;
    const upgCost = t.getUpgradeCost();
    const cost10 = this._computeUpgradeCost(t, 10).totalCost;
    const btn1 = document.getElementById('upgradeBtn');
    const btn10 = document.getElementById('upgradeBtn10');
    const btnMax = document.getElementById('upgradeBtnMax');
    if (btn1) btn1.disabled = this.gold < upgCost;
    if (btn10) btn10.disabled = this.gold < cost10;
    if (btnMax) {
      const maxLvl = this._maxAffordableLevels(t);
      const maxCost = this._computeUpgradeCost(t, maxLvl).totalCost;
      // onclick 中的 N 用闭包重写,避免依赖 inline string
      btnMax.onclick = () => window.tryUpgradeClick(maxLvl);
      btnMax.textContent = `满级 ×${maxLvl}  $${maxCost}`;
      btnMax.disabled = maxLvl <= 1;
    }
  },

  _renderInfoPanel() {
    const infoEl = document.getElementById('infoContent');
    const logEl = document.getElementById('itemLog');
    if (this.selectedTower) {
      const t = this.selectedTower;
      const upgCost = t.getUpgradeCost();
      let html = `<div class="info-title">${t.def.icon} ${t.def.name} Lv.${t.level}${t.isUltimate() ? ' ★' : ''}</div>`;
      html += `<div class="info-row">`;
      html += `<span class="info-item">攻击 <b>${t.getAtk()}</b></span>`;
      html += `<span class="info-item">范围 <b>${(t.getRangeRatio() * 100).toFixed(1)}%</b></span>`;
      html += `<span class="info-item">攻速 <b>${t.getSpeed().toFixed(1)}/s</b></span>`;
      html += `</div>`;
      html += `<div class="info-row">`;
      html += `<span class="info-item">暴击 <b>${(t.critRate * 100).toFixed(0)}%</b></span>`;
      html += `<span class="info-item">爆伤 <b>${(t.critDamage * 100).toFixed(0)}%</b></span>`;
      html += `</div>`;
      // 终极提示
      if (t.isUltimate()) {
        html += `<div style="color:#ffeb3b;font-size:12px;margin-top:2px;">★ ${t.def.ult.name} 觉醒 — ${t.def.ult.desc}</div>`;
      } else if (t.level === ULTIMATE_LEVEL - 1) {
        html += `<div style="color:#ff9800;font-size:12px;margin-top:2px;">下一级解锁 ★ ${t.def.ult.name}</div>`;
      }
      // 升级按钮组:升级 / ×10 一行,满级独占第二行
      const canUpg = this.gold >= upgCost;
      const cost10 = this._computeUpgradeCost(t, 10).totalCost;
      // 内联 onclick,避免 updateUI 反复重画时事件委托漏触发的隐患
      const upgBtn = `<button id="upgradeBtn" class="upg-main" ${canUpg ? '' : 'disabled'} onclick="tryUpgradeClick(1)">升级 $${upgCost}</button>`;
      const upg10 = `<button id="upgradeBtn10" class="upg-multi" ${this.gold >= cost10 ? '' : 'disabled'} onclick="tryUpgradeClick(10)">×10 $${cost10}</button>`;
      const maxLvl = this._maxAffordableLevels(t);
      const maxCost = this._computeUpgradeCost(t, maxLvl).totalCost;
      const upgAll = maxLvl > 1
        ? `<button id="upgradeBtnMax" class="upg-multi upg-max" onclick="tryUpgradeClick(${maxLvl})">满级 ×${maxLvl}  $${maxCost}</button>`
        : '';
      html += `<div class="upg-row upg-row-main">${upgBtn}${upg10}</div>`;
      if (upgAll) html += `<div class="upg-row upg-row-max">${upgAll}</div>`;
      html += `<div class="upg-hint">金币多时直接点 ×10 / 升到顶</div>`;
      infoEl.innerHTML = html;
      this._lastMaxLvl = maxLvl;
      logEl.textContent = '';
    } else if (this.selectedTowerType) {
      // 用户需求:点最下面三个造塔按钮时,完全不弹属性面板
      // 面板会被 _positionInfoPanel 隐藏(!selectedTower),这里同时清空内容确保不残留
      infoEl.innerHTML = '';
      logEl.innerHTML = '';
    } else {
      infoEl.innerHTML = '点击地图放置防御塔，点击已有塔查看信息';
      logEl.textContent = '';
    }
  },

  _positionInfoPanel() {
    const panel = document.getElementById('infoPanel');
    const wrap = document.getElementById('canvasWrap');
    if (!panel || !wrap) return;
    // 用户需求:点最下面三个建塔按钮时,完全不弹属性面板
    // (包括 selectedTowerType != null 时,以及根本没选任何东西时)
    if (!this.selectedTower) {
      panel.classList.remove('show');
      return;
    }
    const wrapW = wrap.clientWidth;
    const wrapH = wrap.clientHeight;
    // 不参与布局,先按内容展开,再读尺寸
    panel.classList.add('show');
    const pw = panel.offsetWidth;
    const ph = panel.offsetHeight;
    let left, top;
    const t = this.selectedTower;
    const cx = (wrapW - this.W) / 2;
    const cy = (wrapH - this.H) / 2;
    // 优先放右侧,空间不够放左侧
    left = cx + t.x + 30;
    if (left + pw > wrapW - 4) left = cx + t.x - pw - 30;
    // 垂直对齐到塔中心
    top = cy + t.y - ph / 2;
    // 越界则夹到 wrap 内
    if (left < 4) left = 4;
    if (left + pw > wrapW - 4) left = wrapW - pw - 4;
    if (top < 4) top = 4;
    if (top + ph > wrapH - 4) top = wrapH - ph - 4;
    panel.style.left = left + 'px';
    panel.style.top = top + 'px';
  },

  upgradeTower() {
    if (!this.selectedTower) return;
    this.tryUpgradeTower(this.selectedTower);
  },

  // 一次连续升级 N 次(中途金币不足自动停止)
  // 优化:每级动态取价(阶梯升级费需要),末尾一次性 UI/粒子/保存
  upgradeMulti(n) {
    if (this.gameOver) return 0;
    if (!this.selectedTower) return 0;
    const tower = this.selectedTower;
    n = Math.max(1, safeRound(safeNum(n, 1, 100000)) | 0);

    let awakened = false;
    let upgraded = 0;
    for (let i = 0; i < n; i++) {
      // 动态取价:阶梯升级费会随等级跨阶梯变化
      const cost = safeFinite(tower.getUpgradeCost(), UPGRADE_COST_FIXED);
      if (cost <= 0) break;
      if (this.gold < cost) break;
      const r = this._applyUpgrade(tower, cost);
      if (!r.ok) break;
      if (r.awakened) awakened = true;
      upgraded++;
    }

    if (upgraded === 0) {
      const nextCost = safeFinite(tower.getUpgradeCost(), UPGRADE_COST_FIXED);
      this.flashRuleHint(`金币不足,需要 $${nextCost}`);
      return 0;
    }

    // 末尾统一刷一次反馈
    this.selectedTower = tower;
    this.selectedTowerType = null;
    this._emitUpgradeFx(tower, { awakened });
    this.updateUI();
    this.scheduleAutoSave();
    return upgraded;
  },

  // ======================== 游戏循环 ========================
  loop(now) {
    const dt = Math.min((now - this.lastTime) / 1000, 0.1);
    this.lastTime = now;

    // FPS 计数(滑动窗口,1 秒刷新一次)
    this.fpsFrames = (this.fpsFrames || 0) + 1;
    this.fpsAcc = (this.fpsAcc || 0) + dt;
    if (this.fpsAcc >= 1) {
      this.fps = this.fpsFrames;
      this.fpsFrames = 0;
      this.fpsAcc = 0;
    }

    // 暂停时:跳过 update 让所有时间相关逻辑(出怪/塔攻击/倒计时)冻结;
    // draw 仍跑让呼吸高亮/粒子飘字继续动,画面不死板。
    if (!this.gameOver && !this.paused) {
      this.update(dt);
    }
    this.draw();
    requestAnimationFrame((t) => this.loop(t));
  },

  update(dt) {
    // 出怪策略:倒计时永远推进 — 上一波没清完下一波也会出来,这是 game over 的真正压力源
    // (清完场上怪只是缩短倒计时,不是阻止下一波)
    if (!this.waveActive) {
      // 场上空了 → 倒计时加速(最低 1.5s),让节奏紧凑
      if ((this._lastAliveCount || 0) === 0 && this.waveTimer > 1.5) {
        this.waveTimer = 1.5;
      }
      this.waveTimer -= dt;
      if (this.waveTimer <= 0) {
        this.startWave();
      }
    }
    // Spawn monsters within current wave
    if (this.waveActive) {
      if (this.spawnedThisWave < this.monstersToSpawn) {
        this.spawnTimer -= dt;
        if (this.spawnTimer <= 0) {
          // 精英怪:本波第一只 (占一个 spawn 名额)
          let isElite = false;
          if (this.eliteQueued && !this.eliteSpawned && this.spawnedThisWave === 0) {
            isElite = true;
            this.eliteSpawned = true;
          }
          const m = new Monster(this.wave, this.waypoints, isElite);
          m.wpIndex = 1; // start moving toward first waypoint after spawn
          this.monsters.push(m);
          this.spawnedThisWave++;
          this.spawnTimer = MONSTER_SPAWN_INTERVAL;
        }
      } else {
        // 当前波所有怪物已出完,开始下一波倒计时
        // 公式: min(CAP, BASE + wave * PER_WAVE) — 早期更短,后期不超过 CAP 秒
        this.waveActive = false;
        this.waveTimer = Math.min(WAVE_INTERVAL_CAP, WAVE_BASE_INTERVAL + this.wave * WAVE_INTERVAL_PER_WAVE);
        filterInPlace(this.monsters, m => m.alive); // cleanup dead, in-place
      }
    }

    // Update towers (热路径:经典 for 比 for...of 在 V8 上快约 30%)
    const towers = this.towers;
    for (let i = 0; i < towers.length; i++) {
      const t = towers[i];
      t.update(dt);
      if (t.canShoot()) {
        const target = t.findTarget(this.monsters);
        if (target) {
          this.projectiles.push(new Projectile(t.x, t.y, target, t));
          t.resetCooldown();
        }
      }
    }

    // Update monsters
    const monsters = this.monsters;
    for (let i = 0; i < monsters.length; i++) {
      monsters[i].update(dt);
    }

    // Update projectiles
    const projectiles = this.projectiles;
    for (let i = 0; i < projectiles.length; i++) {
      projectiles[i].update(dt);
    }

    // Update particles
    const particles = this.particles;
    for (let i = 0; i < particles.length; i++) {
      particles[i].update(dt);
    }

    // Cleanup: in-place 过滤,避免每帧创建 2 个新数组(GC 压力)
    filterInPlace(this.projectiles, p => p.alive);
    filterInPlace(this.particles, p => p.alive);

    // HUD + aliveCount: 复用 updateUI,避免一帧内多次 filter + 多次 getElementById
    this.updateUI();

    // Check game over
    this.checkGameOver();
  },

  draw() {
    const ctx = this.ctx;
    const W = this.W, H = this.H;
    const mL = this.mapLeft, mT = this.mapTop, mR = this.mapRight, mB = this.mapBottom;
    // 共享时间戳:draw 内多处要 (performance.now()/1000), 一次性算好
    const timeNow = performance.now() / 1000;
    this._timeNow = timeNow;

    // ===== 外圈(地图外的"原野"延伸) =====
    ctx.fillStyle = '#1a2a14';
    ctx.fillRect(0, 0, W, H);

    // ===== 草地:主体多层叠加 =====
    // 1) 底色(深草)
    ctx.fillStyle = '#2d4a1f';
    ctx.fillRect(mL, mT, this.mapW, this.mapH);
    // 2) 中心亮一点(被踩出小径的草场,略有光照感)
    const cx = (mL + mR) / 2, cy = (mT + mB) / 2;
    const grad = ctx.createRadialGradient(cx, cy, 20, cx, cy, this.mapW * 0.6);
    grad.addColorStop(0, 'rgba(120, 170, 60, 0.30)');
    grad.addColorStop(0.6, 'rgba(80, 130, 50, 0.10)');
    grad.addColorStop(1, 'rgba(30, 50, 20, 0.0)');
    ctx.fillStyle = grad;
    ctx.fillRect(mL, mT, this.mapW, this.mapH);

    // 3) 草丛(种子随机,固定 seed 让每次都一致)
    if (this.waypoints && this.waypoints.length >= 6) {
      this.drawGrass(ctx, mL, mT, mR, mB);
    } else {
      ctx.fillStyle = '#2d4a1f';
      ctx.fillRect(mL, mT, this.mapW, this.mapH);
    }

    // 4) 地图边框(深木栅栏感)
    ctx.strokeStyle = '#0a1a05';
    ctx.lineWidth = 2;
    ctx.strokeRect(mL, mT, this.mapW, this.mapH);
    // 内圈淡色高光
    ctx.strokeStyle = 'rgba(180, 220, 120, 0.18)';
    ctx.lineWidth = 1;
    ctx.strokeRect(mL + 2, mT + 2, this.mapW - 4, this.mapH - 4);

    // Draw path
    this.drawPath(ctx);

    // Draw spawn point (怪物入口 — 紫色传送门)
    if (!this.waypoints || this.waypoints.length < 1) return;
    const spawn = this.waypoints[0];
    const t = timeNow; // 复用 draw() 顶部算好的 timeNow
    ctx.save();
    // 外晕
    const portalGrad = ctx.createRadialGradient(spawn.x, spawn.y, 2, spawn.x, spawn.y, 14);
    portalGrad.addColorStop(0, 'rgba(220, 120, 255, 0.85)');
    portalGrad.addColorStop(0.6, 'rgba(150, 50, 220, 0.45)');
    portalGrad.addColorStop(1, 'rgba(80, 0, 160, 0)');
    ctx.fillStyle = portalGrad;
    ctx.beginPath();
    ctx.arc(spawn.x, spawn.y, 14, 0, Math.PI * 2);
    ctx.fill();
    // 旋转的符文
    for (let i = 0; i < 4; i++) {
      const a = t * 1.5 + i * Math.PI / 2;
      const rr = 9;
      const px = spawn.x + Math.cos(a) * rr;
      const py = spawn.y + Math.sin(a) * rr;
      ctx.fillStyle = '#ff8aee';
      ctx.beginPath();
      ctx.arc(px, py, 1.4, 0, Math.PI * 2);
      ctx.fill();
    }
    // 中心
    ctx.fillStyle = '#1a0033';
    ctx.beginPath();
    ctx.arc(spawn.x, spawn.y, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#ff8aee';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.restore();

    // Draw towers (热路径:经典 for 比 for...of 快)
    {
      const arr = this.towers;
      for (let i = 0; i < arr.length; i++) {
        const t = arr[i];
        t.draw(ctx, t === this.selectedTower);
      }
    }

    // 同类型塔已存在时: 旧塔呼吸高亮 → 提示"再次点击新位置 = 迁塔+升级"
    if (this.selectedTowerType) {
      const existing = this.towers.find(t => t.type === this.selectedTowerType);
      if (existing) {
        const ph = (timeNow * 10 / 6) % 1; // (performance.now()/600) % 1 — 复用 timeNow
        ctx.save();
        ctx.globalAlpha = 0.5 + 0.4 * Math.sin(ph * Math.PI * 2);
        ctx.strokeStyle = TOWER_DEFS[existing.type].color;
        ctx.lineWidth = 3;
        ctx.setLineDash([6, 4]);
        ctx.beginPath();
        ctx.arc(existing.x, existing.y, 26 + Math.sin(ph * Math.PI * 2) * 3, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.font = 'bold 11px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#ffeb3b';
        ctx.fillText('原位置 → 选新位置迁塔+升级', existing.x, existing.y - 36);
        ctx.restore();
      }
    }

    // Draw monsters / projectiles / particles (热路径:经典 for)
    {
      const arr = this.monsters;
      for (let i = 0; i < arr.length; i++) arr[i].draw(ctx);
    }
    {
      const arr = this.projectiles;
      for (let i = 0; i < arr.length; i++) arr[i].draw(ctx);
    }
    {
      const arr = this.particles;
      for (let i = 0; i < arr.length; i++) arr[i].draw(ctx);
    }

    // Wave status display on canvas
    // 复用 updateUI 算好的 _lastAliveCount,不再独立 filter
    const aliveForDisplay = this._lastAliveCount || 0;
    if (this.waveActive && this.wave > 0) {
      // 正在出怪
      ctx.save();
      ctx.font = '14px sans-serif';
      ctx.fillStyle = 'rgba(255,152,0,0.7)';
      ctx.textAlign = 'center';
      const spawnLeft = this.monstersToSpawn - this.spawnedThisWave;
      ctx.fillText(`第${this.wave}波 · 出怪中 剩余${spawnLeft}只`, W / 2, mT - 6);
      ctx.restore();
    } else if (!this.waveActive && this.waveTimer > 0) {
      // 倒计时中(始终显示 — 不论场上是否有残怪)
      const isCleared = aliveForDisplay === 0;
      const fullInterval = Math.min(WAVE_INTERVAL_CAP, WAVE_BASE_INTERVAL + this.wave * WAVE_INTERVAL_PER_WAVE);
      ctx.save();
      ctx.font = isCleared ? 'bold 16px sans-serif' : '14px sans-serif';
      ctx.textAlign = 'center';
      if (isCleared) {
        // 清场,绿色显示
        ctx.fillStyle = 'rgba(76,175,80,0.8)';
        ctx.fillText(`第${this.wave + 1}波: ${Math.ceil(this.waveTimer)}s`, W / 2, mT - 6);
      } else {
        // 场上还有残怪,警示色提醒倒计时仍在推进
        ctx.fillStyle = 'rgba(255,180,0,0.85)';
        ctx.fillText(`第${this.wave + 1}波: ${Math.ceil(this.waveTimer)}s · 残怪 ${aliveForDisplay}`, W / 2, mT - 6);
      }
      // 倒计时进度条
      const barW = 120, barH = 4;
      const barX = W / 2 - barW / 2;
      const barY = mT - 1;
      const progress = 1 - (this.waveTimer / fullInterval);
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.fillRect(barX, barY, barW, barH);
      ctx.fillStyle = isCleared ? '#4caf50' : '#ff9800';
      ctx.fillRect(barX, barY, barW * progress, barH);
      ctx.restore();
    }

    // 放置鬼影 + 范围圆 + 合法/非法提示 (新建或迁塔都要预览)
    if (this.selectedTowerType && this.hoverPos) {
      const def = TOWER_DEFS[this.selectedTowerType];
      const hx = this.hoverPos.x, hy = this.hoverPos.y;
      const valid = this.isInsideMap(hx, hy) && !this.isOnPath(hx, hy);
      // 合法 = 绿色描边 + 范围圆用塔色但低透明度(避免和"非法红"混淆,也避免火塔的橘红看起来像警告)
      // 非法 = 红色 (固定 #ff4c4c,和任何塔色都明显不同)
      const col = valid ? '#4caf50' : '#ff4c4c';
      const fillCol = valid ? def.color : '#ff4c4c';
      ctx.save();
      // 范围圆(用比例 × 当前 mapW)
      ctx.globalAlpha = valid ? 0.18 : 0.22;
      ctx.fillStyle = fillCol;
      ctx.beginPath();
      ctx.arc(hx, hy, def.rangeRatio * this.mapW, 0, Math.PI * 2);
      ctx.fill();
      // 鬼影塔
      ctx.globalAlpha = 0.55;
      ctx.fillStyle = fillCol;
      ctx.beginPath();
      ctx.arc(hx, hy, 16, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = col;
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 3]);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.font = 'bold 12px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = col;
      ctx.fillText(def.icon, hx, hy);
      if (!valid) {
        ctx.font = '11px sans-serif';
        ctx.fillStyle = '#ff4c4c';
        ctx.fillText('不可放置', hx, hy + 26);
      } else {
        // 合法提示,绿色,和非法红彻底区分
        ctx.font = '11px sans-serif';
        ctx.fillStyle = '#4caf50';
        ctx.fillText('可放置', hx, hy + 26);
      }
      ctx.restore();
    }

    // ===== FPS 指示器(地图左上角) =====
    this._drawFps(ctx);
  },

  _drawFps(ctx) {
    const fps = this.fps != null ? this.fps : 0;
    // 颜色:>=50 绿, 30-49 黄, <30 红
    const col = fps >= 50 ? '#69f0ae' : (fps >= 30 ? '#ffd54f' : '#ff5252');
    const text = `FPS ${fps}`;
    ctx.save();
    ctx.font = 'bold 13px monospace';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    // 半透明深色底,保证浅色/深色地图都看得清
    const padX = 6, padY = 3;
    const w = ctx.measureText(text).width;
    ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
    ctx.fillRect(this.mapLeft + 6, this.mapTop + 6, w + padX * 2, 13 + padY * 2);
    ctx.fillStyle = col;
    ctx.fillText(text, this.mapLeft + 6 + padX, this.mapTop + 6 + padY);
    ctx.restore();
  },

  drawPath(ctx) {
    const wp = this.waypoints;
    if (!wp || wp.length < 2) return;

    // 路径离屏缓存:整条路径(走廊底色 + 石板 + 箭头)是静态的,
    // 缓存为一张 canvas,每帧只 drawImage 一次,免去几百块石板的重绘
    if (!this._pathCache || this._pathCache.w !== this.W || this._pathCache.h !== this.H) {
      this._buildPathCache();
    }
    if (this._pathCache) {
      ctx.drawImage(this._pathCache.canvas, 0, 0);
    }
  },

  _buildPathCache() {
    const wp = this.waypoints;
    if (!wp || wp.length < 2) return;
    const off = document.createElement('canvas');
    off.width = this.W;
    off.height = this.H;
    const ctx = off.getContext('2d');

    // 怪物路径: spawn(0) -> 1 -> 2 -> 3 -> 4 -> 5 -> 1 -> 2 -> ...
    const polyline = [wp[0], wp[1], wp[2], wp[3], wp[4], wp[5], wp[1]];
    const tileW = 22, tileH = 18;
    const corridorR = tileW * 0.55;

    // 1) 走廊底色
    this.strokePolyline(ctx, polyline, corridorR, '#2c2820');

    // 2) 石板
    this.drawCobbleOnPolyline(ctx, polyline, tileW, tileH);

    // 3) 箭头
    ctx.fillStyle = 'rgba(245, 240, 220, 0.55)';
    const arrowSize = 5;
    for (let i = 0; i < polyline.length - 1; i++) {
      const a = polyline[i], b = polyline[i + 1];
      const mx = (a.x + b.x) / 2;
      const my = (a.y + b.y) / 2;
      const angle = Math.atan2(b.y - a.y, b.x - a.x);
      ctx.save();
      ctx.translate(mx, my);
      ctx.rotate(angle);
      ctx.beginPath();
      ctx.moveTo(arrowSize, 0);
      ctx.lineTo(-arrowSize, -arrowSize * 0.6);
      ctx.lineTo(-arrowSize, arrowSize * 0.6);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    this._pathCache = { canvas: off, w: this.W, h: this.H };
  },

  // 旧 drawPath 函数体已挪到 _buildPathCache,保留下面的辅助函数

  // 沿一条带 waypoint 的折线画"走廊"—— 用 lineCap='round' + lineJoin='round' 的粗描边
  strokePolyline(ctx, wps, halfWidth, color) {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = halfWidth * 2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(wps[0].x, wps[0].y);
    for (let i = 1; i < wps.length; i++) ctx.lineTo(wps[i].x, wps[i].y);
    ctx.stroke();
    ctx.restore();
  },

  // 沿一条折线(带 waypoint)按弧长均匀铺设石板
  drawCobbleOnPolyline(ctx, wps, tileW, tileH) {
    const L = this.mapLeft, T = this.mapTop, R = this.mapRight, B = this.mapBottom;
    if (!isFinite(wps[0].x)) return;
    // 1) 计算每段的累计弧长
    const segs = [];
    let totalLen = 0;
    for (let i = 0; i < wps.length - 1; i++) {
      const dx = wps[i+1].x - wps[i].x;
      const dy = wps[i+1].y - wps[i].y;
      const len = Math.hypot(dx, dy);
      if (len < 1) continue;
      segs.push({ a: wps[i], b: wps[i+1], dx, dy, len, cum: totalLen });
      totalLen += len;
    }
    if (totalLen < 1) return;
    // 2) 按弧长均匀铺石板
    const nTiles = Math.max(2, Math.floor(totalLen / tileW));
    const seedBase = Math.floor(wps[0].x * 13 + wps[0].y * 7 + (wps[1]?.x || 0) * 3 + (wps[1]?.y || 0) * 17) | 0;
    let s = seedBase >>> 0;
    const rnd = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 0xffffffff; };

    for (let i = 0; i <= nTiles; i++) {
      const t = (i / nTiles) * totalLen;
      // 找段
      let seg = segs[segs.length - 1];
      for (let k = 0; k < segs.length - 1; k++) {
        if (t < segs[k+1].cum) { seg = segs[k]; break; }
      }
      const local = Math.max(0, Math.min(seg.len, t - seg.cum));
      const px = seg.a.x + seg.dx * (local / seg.len) + (rnd() - 0.5) * 1.5;
      const py = seg.a.y + seg.dy * (local / seg.len) + (rnd() - 0.5) * 1.5;
      const tangAng = Math.atan2(seg.dy, seg.dx) + (rnd() - 0.5) * 0.18;
      const w = tileW * (0.9 + rnd() * 0.18);
      const h = tileH * (0.95 + rnd() * 0.15);
      // 旋转后外接矩形(轴对齐):( |cos|*w + |sin|*h ) / 2
      const cosA = Math.abs(Math.cos(tangAng));
      const sinA = Math.abs(Math.sin(tangAng));
      const halfW = (w * cosA + h * sinA) / 2;
      const halfH = (w * sinA + h * cosA) / 2;
      const margin = 0.5;
      if (px - halfW < L + margin || px + halfW > R - margin ||
          py - halfH < T + margin || py + halfH > B - margin) {
        // 越界石板:用纯石板色填充,确保不露底色
        this.drawFallbackStone(ctx, px, py, tangAng, w, h);
        continue;
      }
      this.drawStone(ctx, px, py, tangAng, w, h, rnd);
    }
  },

  // 越界回退石板:只填石板色 + 暗描边(不画高光/青苔/裂痕,避免越界颜色不一致)
  drawFallbackStone(ctx, px, py, ang, w, h) {
    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(ang);
    ctx.fillStyle = 'rgb(165,163,153)';
    roundRect(ctx, -w / 2, -h / 2, w, h, 2);
    ctx.fill();
    ctx.strokeStyle = '#1a1812';
    ctx.lineWidth = 1;
    roundRect(ctx, -w / 2, -h / 2, w, h, 2);
    ctx.stroke();
    ctx.restore();
  },

  // 一块完整石板
  drawStone(ctx, px, py, ang, w, h, rnd) {
    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(ang);
    // 石板外描边(深灰,模拟砂浆缝)
    ctx.fillStyle = '#1a1812';
    roundRect(ctx, -w / 2, -h / 2, w, h, 3);
    ctx.fill();
    // 石板主色(冷灰)
    const shade = 0.78 + rnd() * 0.22;
    const r = Math.floor(170 * shade);
    const g = Math.floor(168 * shade);
    const bch = Math.floor(158 * shade);
    ctx.fillStyle = `rgb(${r},${g},${bch})`;
    roundRect(ctx, -w / 2 + 1, -h / 2 + 1, w - 2, h - 2, 2);
    ctx.fill();
    // 顶部高光
    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    roundRect(ctx, -w / 2 + 2, -h / 2 + 2, w - 4, (h - 4) * 0.35, 2);
    ctx.fill();
    // 散点青苔(小概率)
    if (rnd() < 0.18) {
      ctx.fillStyle = 'rgba(110, 160, 70, 0.55)';
      ctx.beginPath();
      ctx.arc((rnd() - 0.5) * w * 0.6, (rnd() - 0.5) * h * 0.5, 1.2 + rnd() * 0.8, 0, Math.PI * 2);
      ctx.fill();
    }
    // 裂痕(低概率)
    if (rnd() < 0.12) {
      ctx.strokeStyle = 'rgba(60,50,40,0.35)';
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.moveTo(-w * 0.3, -h * 0.1);
      ctx.lineTo((rnd() - 0.5) * w * 0.6, (rnd() - 0.5) * h * 0.5);
      ctx.stroke();
    }
    ctx.restore();
  },

  // 草地(随机草丛和小花,seed 固定)
  drawGrass(ctx, x0, y0, x1, y1) {
    if (!this._grassSeed) this._grassSeed = (Math.random() * 1e9) >>> 0;
    // 缓存:尺寸变了重建
    if (this._grassCache && (this._grassCache.w !== this.mapW || this._grassCache.h !== this.mapH)) {
      this._grassCache = null;
    }
    if (!this._grassCache) {
      const w = this.mapW, h = this.mapH;
      const off = document.createElement('canvas');
      off.width = w; off.height = h;
      const o = off.getContext('2d');
      let s = this._grassSeed >>> 0;
      const rnd = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 0xffffffff; };
      const blades = Math.floor((w * h) / 240); // ~密度
      for (let i = 0; i < blades; i++) {
        const x = rnd() * w, y = rnd() * h;
        // 跳过路径(用 isOnPath 简化判断,这里直接以中心空出也够用;走个便宜的距离阈值)
        if (this._nearPath(x + x0, y + y0, 12)) continue;
        const ang = -Math.PI / 2 + (rnd() - 0.5) * 0.5;
        const len = 3 + rnd() * 4;
        o.strokeStyle = `rgba(${60 + (rnd()*30)|0}, ${110 + (rnd()*40)|0}, ${50 + (rnd()*30)|0}, ${0.55 + rnd() * 0.3})`;
        o.lineWidth = 0.9;
        o.beginPath();
        o.moveTo(x, y);
        o.lineTo(x + Math.cos(ang) * len, y + Math.sin(ang) * len);
        o.stroke();
      }
      // 小花(白色/黄色)
      const flowers = Math.floor(blades * 0.05);
      for (let i = 0; i < flowers; i++) {
        const x = rnd() * w, y = rnd() * h;
        if (this._nearPath(x + x0, y + y0, 14)) continue;
        const col = rnd() < 0.7 ? '#fff8b8' : '#ffe07a';
        o.fillStyle = col;
        o.beginPath();
        o.arc(x, y, 1.4, 0, Math.PI * 2);
        o.fill();
      }
      // 阴影点(深一些,增加斑驳感)
      for (let i = 0; i < blades * 0.4; i++) {
        const x = rnd() * w, y = rnd() * h;
        if (this._nearPath(x + x0, y + y0, 10)) continue;
        o.fillStyle = `rgba(0,0,0,${0.06 + rnd() * 0.06})`;
        o.beginPath();
        o.arc(x, y, 1.5 + rnd() * 1.2, 0, Math.PI * 2);
        o.fill();
      }
      this._grassCache = { canvas: off, w, h };
    }
    ctx.drawImage(this._grassCache.canvas, x0, y0);
  },

  // 离路径 < dist 的点(用于跳过路径上的草丛)
  _nearPath(x, y, dist) {
    const wp = this.waypoints;
    if (!wp || wp.length < 2) return false;
    const segs = [
      [wp[0], wp[1]], [wp[1], wp[2]], [wp[2], wp[3]],
      [wp[3], wp[4]], [wp[4], wp[5]], [wp[5], wp[1]],
    ];
    for (const [a, b] of segs) {
      if (distPointSeg(x, y, a.x, a.y, b.x, b.y) < dist) return true;
    }
    return false;
  },
};

// ======================== 启动 ========================
window.addEventListener('DOMContentLoaded', () => {
  game.init();
});
</script>
